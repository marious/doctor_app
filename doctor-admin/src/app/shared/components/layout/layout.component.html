<div class="app-shell">
  <aside class="sidebar" [class.collapsed]="!sidebarOpen()">

    <div class="sidebar-header">
      <div class="logo-mark">
        <svg viewBox="0 0 36 36" fill="none" width="36" height="36">
          <circle cx="18" cy="18" r="18" fill="#FEF0F7"/>
          <path d="M18 27s-8-5.2-8-10.5a4.5 4.5 0 019 0 4.5 4.5 0 019 0C28 21.8 18 27 18 27z" fill="#E8277D"/>
        </svg>
      </div>
      @if (sidebarOpen()) {
        <div class="logo-text">
          <span class="logo-name">HerCare</span>
          <span class="logo-sub">Care for Every Stage of Womanhood</span>
        </div>
      }
    </div>

    <nav class="sidebar-nav">
      @for (item of navItems; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active" class="nav-item" [title]="item.label">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
            <path [attr.d]="item.icon"/>
          </svg>
          @if (sidebarOpen()) {
            <span class="nav-label">{{ item.label }}</span>
          }
        </a>
      }
    </nav>

    <div class="sidebar-footer">
      <a routerLink="/settings" routerLinkActive="active" class="nav-item" title="Settings">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
          <path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        @if (sidebarOpen()) {
          <span class="nav-label">Settings</span>
        }
      </a>
      <button class="nav-item logout-btn" (click)="logout()" title="Logout">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
          <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
        </svg>
        @if (sidebarOpen()) {
          <span class="nav-label">Logout</span>
        }
      </button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <button class="toggle-btn" (click)="toggleSidebar()" title="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" width="18" height="18">
          <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
      </button>

      <div class="topbar-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="#A0AEC0" stroke-width="2" stroke-linecap="round" width="15" height="15">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" placeholder="Search..." />
      </div>

      <div class="topbar-right">
        <button class="icon-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
               stroke-linecap="round" width="20" height="20">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/>
          </svg>
        </button>
        <div class="topbar-user">
          <div class="user-avatar">
            {{ auth.currentUser()?.name?.charAt(0) | uppercase }}
          </div>
          <span class="user-name">Dr. {{ auth.currentUser()?.name }}</span>
        </div>
      </div>
    </header>

    <main class="page-content">
      <router-outlet />
    </main>
  </div>
</div>
